<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Transform - translate3d()</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-sub: #64748b;
            
            /* 액센트 컬러 */
            --emerald-main: #10b981;
            --amber-main: #f59e0b;
            --blue-main: #3b82f6;
            --rose-main: #f43f5e;
            --code-bg: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        p.description {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
        }

        .demo-section {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .demo-card {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .demo-card label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .code-tag {
            font-family: monospace;
            background-color: var(--code-bg);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            color: #6366f1;
        }

        /* 3D 원근감을 위한 부모 가이드 영역 */
        .scene-wrapper {
            position: relative;
            width: 150px;
            height: 80px;
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            background-color: rgba(241, 245, 249, 0.4);
        }

        /* 공통 3D 변형 박스 */
        .box {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
        }

        /* 1. 근접 원근(100px) + 앞으로 50px */
        #trns01 {
            background: linear-gradient(135deg, #34d399, var(--emerald-main));
            transform: perspective(100px) translate3d(50px, 20px, 50px);
        }

        /* 2. 중간 원근(200px) + Z축 이동 없음(0px) */
        #trns02 {
            background: linear-gradient(135deg, #fbbf24, var(--amber-main));
            transform: perspective(200px) translate3d(50px, 20px, 0px);
        }

        /* 3. 완만한 원근(300px) + 뒤로 50px */
        #trns03 {
            background: linear-gradient(135deg, #60a5fa, var(--blue-main));
            transform: perspective(300px) translate3d(50px, 20px, -50px);
        }

        /* 4. 완만한 원근(300px) + 앞으로 50px */
        #trns04 {
            background: linear-gradient(135deg, #fb7185, var(--rose-main));
            transform: perspective(300px) translate3d(50px, 20px, 50px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Transform3D: translate3d()</h1>
        <p class="description">원근감(Perspective)과 Z축 이동에 따른 깊이감의 차이를 확인하세요.</p>

        <div class="demo-section">
            <!-- 1. 근접 원근 + Z축 앞으로 -->
            <div class="demo-card">
                <label>
                    <span>강한 원근감 + 화면 앞으로 튀어나옴</span>
                    <mark class="code-tag">perspective(100px) Z: 50px</mark>
                </label>
                <div class="scene-wrapper">
                    <div id="trns01" class="box">Z: +50px (P:100)</div>
                </div>
            </div>

            <!-- 2. 중간 원근 + Z축 이동 없음 -->
            <div class="demo-card">
                <label>
                    <span>중간 원근감 + Z축 변하게 없음</span>
                    <mark class="code-tag">perspective(200px) Z: 0px</mark>
                </label>
                <div class="scene-wrapper">
                    <div id="trns02" class="box">Z: 0px (P:200)</div>
                </div>
            </div>

            <!-- 3. 완만한 원근 + Z축 뒤로 -->
            <div class="demo-card">
                <label>
                    <span>완만한 원근감 + 화면 뒤로 들어감</span>
                    <mark class="code-tag">perspective(300px) Z: -50px</mark>
                </label>
                <div class="scene-wrapper">
                    <div id="trns03" class="box">Z: -50px (P:300)</div>
                </div>
            </div>

            <!-- 4. 완만한 원근 + Z축 앞으로 -->
            <div class="demo-card">
                <label>
                    <span>완만한 원근감 + 화면 앞으로 튀어나옴</span>
                    <mark class="code-tag">perspective(300px) Z: 50px</mark>
                </label>
                <div class="scene-wrapper">
                    <div id="trns04" class="box">Z: +50px (P:300)</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
