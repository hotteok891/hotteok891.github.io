<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 2D Transform - rotate()</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-sub: #64748b;
            
            /* 액센트 컬러 */
            --rose-main: #f43f5e;
            --emerald-main: #10b981;
            --indigo-main: #6366f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        p.description {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
        }

        .demo-section {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .demo-card {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .demo-card label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .code-tag {
            font-family: monospace;
            background-color: #f1f5f9;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            color: var(--indigo-main);
        }

        /* 원래 위치 및 각도를 나타내는 기준점 가이드 */
        .box-wrapper {
            position: relative;
            width: 150px;
            height: 80px;
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            background-color: rgba(241, 245, 249, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 회전 회전축 점 표시 */
        .box-wrapper::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: var(--text-sub);
            border-radius: 50%;
            z-index: 2;
        }

        /* 공통 변형 박스 */
        .box {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
            transition: transform 0.3s ease;
        }

        /* 1. 시계 반대 방향 회전 (-15deg) */
        #rotate01 {
            background: linear-gradient(135deg, #fb7185, var(--rose-main));
            transform: rotate(-15deg);
        }

        /* 2. 시계 방향 회전 (30deg) */
        #rotate02 {
            background: linear-gradient(135deg, #34d399, var(--emerald-main));
            transform: rotate(30deg);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Transform: rotate()</h1>
        <p class="description">중앙 기준점을 기반으로 요소를 회전시킵니다. (회색 점선: 0도 위치)</p>

        <div class="demo-section">
            <!-- 시계 반대 방향 회전 -->
            <div class="demo-card">
                <label>
                    <span>시계 반대 방향 15도 회전</span>
                    <mark class="code-tag">rotate(-15deg)</mark>
                </label>
                <div class="box-wrapper">
                    <div id="rotate01" class="box">-15°</div>
                </div>
            </div>

            <!-- 시계 방향 회전 -->
            <div class="demo-card">
                <label>
                    <span>시계 방향 30도 회전</span>
                    <mark class="code-tag">rotate(30deg)</mark>
                </label>
                <div class="box-wrapper">
                    <div id="rotate02" class="box">+30°</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
