<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숫자 맞추기 게임 분석 대시보드 및 실시간 실행</title>
    <style>
        /* --- CSS 스타일 (AI Performance Dashboard 다크 테마) --- */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --repo-bg: #0b111e;
            --border-color: #334155;
            --code-bg: #0b1220;
            --green: #34d399;
            --orange: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Pretendard', sans-serif;
            line-height: 1.7;
            scroll-behavior: smooth;
        }

        /* 상단 서브 내비게이션 바 */
        .repo-nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--repo-bg);
            border-bottom: 1px solid #1e293b;
            z-index: 1001;
        }
        
        .repo-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 20px;
        }

        .repo-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        .repo-links {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        .repo-links a {
            color: #a5f3fc;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.3s;
        }

        .repo-links a:hover {
            color: var(--text-primary);
            text-shadow: 0 0 8px var(--accent-color);
        }

        /* 메인 내비게이션 바 */
        nav {
            position: fixed;
            top: 37px;
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1e293b;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 20px;
        }

        .logo {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent-color);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-color);
        }

        /* 메인 콘텐츠 영역 */
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 140px 20px 80px 20px;
        }

        section {
            padding: 30px 0;
            border-bottom: 1px solid #1e293b;
        }

        h1 {
            font-size: 2.8rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        h2 {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 20px;
        }

        h3 {
            font-size: 1.3rem;
            color: #cbd5e1;
            margin: 20px 0 10px;
        }

        p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            margin-bottom: 15px;
        }

        /* 카드 및 그리드 레이아웃 */
        .card {
            background: var(--card-bg);
            padding: 35px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
            transition: 0.3s;
        }

        .card:hover {
            border-color: var(--accent-color);
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.1);
        }

        pre {
            background: var(--code-bg);
            color: #e5eefb;
            border-radius: 12px;
            padding: 20px;
            overflow: auto;
            line-height: 1.6;
            font-size: 0.92rem;
            margin: 20px 0;
            border: 1px solid #1e293b;
        }

        code {
            font-family: Consolas, monospace;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 2px 6px;
            border-radius: 4px;
        }

        pre code {
            background: transparent;
            color: inherit;
            padding: 0;
        }

        .note {
            border-left: 4px solid var(--accent-color);
            background: rgba(56, 189, 248, 0.05);
            padding: 15px 20px;
            border-radius: 0 12px 12px 0;
            margin: 20px 0;
            color: #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 14px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #0f172a;
            color: var(--accent-color);
            font-weight: 600;
        }

        td {
            color: var(--text-secondary);
        }

        .pill {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 999px;
            padding: 4px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        ul {
            padding-left: 20px;
            color: var(--text-secondary);
            margin: 15px 0;
        }

        li {
            margin-bottom: 8px;
        }

        /* 실행 버튼 및 커스텀 게임 패널 전용 스타일 */
        .run-btn {
            background-color: var(--green);
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }

        .run-btn:hover {
            background-color: #6ee7b7;
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.4);
        }

        .game-panel {
            margin-top: 20px;
            display: none;
            border: 1px solid var(--accent-color);
            border-radius: 16px;
            padding: 25px;
            background: #0b1220;
        }

        .game-panel input[type="text"] {
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            margin: 0 5px;
        }

        .game-panel input[type="button"], 
        .game-panel input[type="reset"] {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 6px 14px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            transition: 0.2s;
        }

        .game-panel input[type="button"]:hover, 
        .game-panel input[type="reset"]:hover {
            background: #7dd3fc;
        }

        footer {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px 20px;
            border-top: 1px solid #1e293b;
            font-size: 0.9rem;
        }

        @media(max-width: 768px) {
            h1 { font-size: 2.2rem; }
            h2 { font-size: 1.5rem; }
            .card { padding: 20px; }
        }
    </style>
    
    <!-- 숫자 맞추기 게임 실시간 제어 스크립트 -->
    <script>
        function toggleGame() {
            var panel = document.getElementById("gamePanel");
            if (panel.style.display === "none" || panel.style.display === "") {
                panel.style.display = "block";
            } else {
                panel.style.display = "none";
            }
        }

        var clickNum = 0;

            document.getElementById("rnd").value = "**";
            clickNum = 0;
            document.getElementById("clickN").value = "";
            document.getElementById("result").value = "";
            document.getElementById("txt").value = "";
